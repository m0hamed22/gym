<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>سجل الاشتراكات</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/tabler-icons.min.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0F0F13; font-family: system-ui, -apple-system, sans-serif; color: #F0EFF8; min-height: 100vh; }
  .app { max-width: 420px; margin: 0 auto; padding-bottom: 40px; }

  .top-bar { padding: 20px 16px 14px; display: flex; align-items: center; gap: 12px; border-bottom: 0.5px solid #23213A; }
  .top-icon { width: 38px; height: 38px; border-radius: 11px; background: #534AB7; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .top-icon i { font-size: 20px; color: #fff; }
  .top-title { font-size: 16px; font-weight: 600; }
  .top-sub { font-size: 11px; color: #6B6890; margin-top: 2px; }

  .stats-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; padding: 14px 16px 0; }
  .stat { background: #1A1830; border: 0.5px solid #23213A; border-radius: 12px; padding: 12px 8px; text-align: center; }
  .stat-num { font-size: 26px; font-weight: 600; }
  .stat-num.g { color: #4ECB71; }
  .stat-num.a { color: #F0A040; }
  .stat-num.r { color: #E85F5F; }
  .stat-lbl { font-size: 10px; color: #6B6890; margin-top: 3px; }

  .section { padding: 16px 16px 0; }
  .sec-title { font-size: 10px; font-weight: 600; color: #6B6890; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }

  .form-card { background: #1A1830; border: 0.5px solid #23213A; border-radius: 16px; padding: 14px; }
  .flbl { font-size: 11px; color: #6B6890; margin-bottom: 5px; font-weight: 500; }
  .finput, .fselect {
    width: 100%; background: #0F0F13; border: 0.5px solid #2D2B48;
    border-radius: 10px; padding: 11px 12px; font-size: 14px;
    color: #F0EFF8; font-family: inherit; outline: none; -webkit-appearance: none; appearance: none;
  }
  .finput:focus, .fselect:focus { border-color: #7F77DD; box-shadow: 0 0 0 3px rgba(127,119,221,0.2); }
  .finput::placeholder { color: #3D3B58; }
  .finput.err { border-color: #E85F5F; box-shadow: 0 0 0 3px rgba(232,95,95,0.2); }
  .frow { margin-bottom: 10px; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .pkg-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: flex-end; }
  .btn-add {
    background: #534AB7; color: #fff; border: none; border-radius: 10px;
    padding: 11px 18px; font-size: 14px; font-family: inherit; font-weight: 600;
    cursor: pointer; display: flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .btn-add:active { background: #3C3489; transform: scale(0.97); }

  .search-wrap { position: relative; margin-bottom: 10px; }
  .search-icon { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 16px; color: #3D3B58; pointer-events: none; }
  .sinput {
    width: 100%; background: #1A1830; border: 0.5px solid #23213A;
    border-radius: 10px; padding: 11px 36px 11px 12px;
    font-size: 14px; color: #F0EFF8; font-family: inherit; outline: none;
  }
  .sinput:focus { border-color: #7F77DD; }
  .sinput::placeholder { color: #3D3B58; }

  .filter-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; margin-bottom: 12px; scrollbar-width: none; }
  .filter-row::-webkit-scrollbar { display: none; }
  .fbtn { background: #1A1830; border: 0.5px solid #23213A; border-radius: 20px; padding: 6px 14px; font-size: 12px; color: #6B6890; cursor: pointer; font-family: inherit; white-space: nowrap; flex-shrink: 0; }
  .fbtn.active { background: #2A2754; border-color: #534AB7; color: #AFA9EC; font-weight: 600; }

  .mlist { display: flex; flex-direction: column; gap: 8px; }
  .mcard { background: #1A1830; border: 0.5px solid #23213A; border-radius: 14px; padding: 13px 14px; display: flex; align-items: center; gap: 12px; }
  .mavatar { width: 42px; height: 42px; border-radius: 50%; background: #2A2754; color: #AFA9EC; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; flex-shrink: 0; }
  .minfo { flex: 1; min-width: 0; }
  .mname { font-size: 14px; font-weight: 600; color: #F0EFF8; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mdates { font-size: 11px; color: #6B6890; }
  .mdays { font-size: 11px; margin-top: 3px; font-weight: 500; }
  .mdays.ok { color: #4ECB71; }
  .mdays.warn { color: #F0A040; }
  .mdays.over { color: #E85F5F; }
  .mright { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
  .badge { font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 600; }
  .ba { background: #0C2E1A; color: #4ECB71; border: 0.5px solid #1A5C35; }
  .bw { background: #301E00; color: #F0A040; border: 0.5px solid #5C3A00; }
  .be { background: #2E0D0D; color: #E85F5F; border: 0.5px solid #5C1A1A; }
  .pkgtag { font-size: 10px; color: #6B6890; background: #0F0F13; border-radius: 6px; padding: 2px 8px; border: 0.5px solid #23213A; }
  .delbtn { background: none; border: none; cursor: pointer; color: #3D3B58; padding: 4px; border-radius: 7px; font-size: 17px; display: flex; }
  .delbtn:active { color: #E85F5F; }
  .empty { text-align: center; padding: 40px 16px; color: #3D3B58; font-size: 13px; }
  .empty i { font-size: 40px; display: block; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="app">
  <div class="top-bar">
    <div class="top-icon"><i class="ti ti-barbell"></i></div>
    <div>
      <div class="top-title">سجل الاشتراكات</div>
      <div class="top-sub">إدارة أعضاء الجيم</div>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat"><div class="stat-num g" id="cnt-a">0</div><div class="stat-lbl">نشط</div></div>
    <div class="stat"><div class="stat-num a" id="cnt-w">0</div><div class="stat-lbl">ينتهي قريباً</div></div>
    <div class="stat"><div class="stat-num r" id="cnt-e">0</div><div class="stat-lbl">منتهي</div></div>
  </div>

  <div class="section" style="margin-top:16px">
    <div class="sec-title">إضافة عضو جديد</div>
    <div class="form-card">
      <div class="frow">
        <div class="flbl">اسم العضو</div>
        <input class="finput" id="iname" type="text" placeholder="مثال: أحمد محمد" />
      </div>
      <div class="two-col">
        <div><div class="flbl">تاريخ البداية</div><input class="finput" id="istart" type="date" /></div>
        <div><div class="flbl">تاريخ الانتهاء</div><input class="finput" id="iend" type="date" /></div>
      </div>
      <div class="pkg-row">
        <div>
          <div class="flbl">الباقة</div>
          <select class="fselect" id="ipkg">
            <option value="شهري">شهري</option>
            <option value="3 شهور">3 شهور</option>
            <option value="6 شهور">6 شهور</option>
            <option value="سنوي">سنوي</option>
          </select>
        </div>
        <button class="btn-add" onclick="addMember()"><i class="ti ti-plus"></i> إضافة</button>
      </div>
    </div>
  </div>

  <div class="section" style="margin-top:16px">
    <div class="sec-title">الأعضاء</div>
    <div class="search-wrap">
      <i class="ti ti-search search-icon"></i>
      <input class="sinput" id="isearch" type="text" placeholder="ابحث عن عضو..." oninput="render()" />
    </div>
    <div class="filter-row">
      <button class="fbtn active" onclick="setF('all',this)">الكل</button>
      <button class="fbtn" onclick="setF('active',this)">نشط</button>
      <button class="fbtn" onclick="setF('expiring',this)">ينتهي قريباً</button>
      <button class="fbtn" onclick="setF('expired',this)">منتهي</button>
    </div>
    <div class="mlist" id="mlist"></div>
  </div>
</div>

<script>
  let members = [], fMode = 'all';
  document.getElementById('istart').value = new Date().toISOString().split('T')[0];

  function initials(n){ return n.trim().split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?'; }
  function status(end){
    const now = new Date();
    const todayStr = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
    const [ty,tm,td] = todayStr.split('-').map(Number);
    const [ey,em,ed] = end.split('-').map(Number);
    const t = new Date(ty,tm-1,td);
    const e = new Date(ey,em-1,ed);
    const d = Math.round((e-t)/86400000);
    if(d<0) return{l:'منتهي',c:'expired',d};
    if(d<=7) return{l:'ينتهي قريباً',c:'expiring',d};
    return{l:'نشط',c:'active',d};
  }
  function fmt(d){ if(!d)return'-'; const[y,m,day]=d.split('-'); return`${day}/${m}/${y}`; }

  function addMember(){
    const name=document.getElementById('iname').value.trim();
    const start=document.getElementById('istart').value;
    const end=document.getElementById('iend').value;
    const pkg=document.getElementById('ipkg').value;
    let ok=true;
    if(!name){ flash('iname'); ok=false; }
    if(!end){ flash('iend'); ok=false; }
    if(!ok) return;
    members.push({id:Date.now(),name,start,end,pkg});
    document.getElementById('iname').value='';
    document.getElementById('iend').value='';
    render();
  }
  function flash(id){
    const el=document.getElementById(id);
    el.classList.add('err'); el.focus();
    setTimeout(()=>el.classList.remove('err'),2000);
  }
  function delMember(id){ members=members.filter(m=>m.id!==id); render(); }
  function setF(f,btn){
    fMode=f;
    document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active'); render();
  }
  function render(){
    const q=document.getElementById('isearch').value.trim().toLowerCase();
    let a=0,w=0,e=0;
    members.forEach(m=>{ const s=status(m.end).c; if(s==='active')a++; else if(s==='expiring')w++; else e++; });
    document.getElementById('cnt-a').textContent=a;
    document.getElementById('cnt-w').textContent=w;
    document.getElementById('cnt-e').textContent=e;
    const list=document.getElementById('mlist');
    const filtered=members.filter(m=>{
      const s=status(m.end);
      return(!q||m.name.toLowerCase().includes(q))&&(fMode==='all'||s.c===fMode);
    });
    if(!filtered.length){
      list.innerHTML=`<div class="empty"><i class="ti ti-users"></i>لا يوجد أعضاء بعد</div>`;
      return;
    }
    const bc={'active':'ba','expiring':'bw','expired':'be'};
    const dc={'active':'ok','expiring':'warn','expired':'over'};
    list.innerHTML = filtered.map(m=>{
      const s=status(m.end);
      const dt=s.d<0?`انتهى منذ ${Math.abs(s.d)} يوم`:s.d===0?'ينتهي اليوم':`متبقي ${s.d} يوم`;
      return`<div class="mcard" data-id="${m.id}">
        <div class="mavatar">${initials(m.name)}</div>
        <div class="minfo">
          <div class="mname">${m.name}</div>
          <div class="mdates">${fmt(m.start)} ← ${fmt(m.end)}</div>
          <div class="mdays ${dc[s.c]}">${dt}</div>
        </div>
        <div class="mright">
          <span class="badge ${bc[s.c]}">${s.l}</span>
          <span class="pkgtag">${m.pkg}</span>
          <button class="delbtn" data-del="${m.id}" aria-label="حذف"><i class="ti ti-trash"></i></button>
        </div>
      </div>`;
    }).join('');

    list.querySelectorAll('.delbtn').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = Number(btn.getAttribute('data-del'));
        members = members.filter(m => m.id !== id);
        render();
      });
    });
  }
  render();
</script>
</body>
</html>
